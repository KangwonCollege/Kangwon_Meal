apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: kangwon-meal
spec:
  replicas: 2   # Gunicorn이 프로세스를 관리하므로 파드는 2개로 수평 확장
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: kangwon-meal:latest
        imagePullPolicy: Never   # Kind에 로컬로 로드한 이미지 사용 (레지스트리 없음)
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "mysql-service"   # MySQL Service 이름 = DNS 주소
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
        readinessProbe:
          httpGet:
            path: /docs   # FastAPI 기본 Swagger UI 엔드포인트
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"    # 128Mi → 256Mi
          limits:
            cpu: "500m"
            memory: "512Mi"    # 128Mi → 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: kangwon-meal
spec:
  selector:
    app: fastapi
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP   # Nginx를 통해서만 접근, 외부 직접 노출 안 함
