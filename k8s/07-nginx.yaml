apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: kangwon-meal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config-vol
          mountPath: /etc/nginx/conf.d   # 기본 설정 디렉토리에 ConfigMap 마운트
      volumes:
      - name: nginx-config-vol
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: kangwon-meal
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080   # kind-config.yaml의 containerPort와 반드시 일치해야 함
  type: NodePort      # 외부(호스트 PC)에서 접근 가능한 유일한 진입점
